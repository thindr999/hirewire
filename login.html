<!DOCTYPE html>
<html>
<head>
  <title>Login - HireWire</title>
</head>

<body style="font-family: Arial; text-align:center; margin-top:100px;">

<h1>Login</h1>

<input id="email" type="email" placeholder="Email" style="padding:10px; width:250px;"><br><br>
<input id="password" type="password" placeholder="Password" style="padding:10px; width:250px;"><br><br>

<button onclick="login()">Login</button>

<br><br>
<a href="index.html">Back to Home</a>

<script>
function login() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  let savedUser = JSON.parse(localStorage.getItem("hirewire_user"));

  if (!savedUser) {
    alert("No account found. Please sign up first.");
    return;
  }

  if (email === savedUser.email && password === savedUser.password) {
    alert("Login successful!");
    window.location.href = "dashboard.html";
  } else {
    alert("Invalid credentials");
  }
}
</script>

</body>
</html>
