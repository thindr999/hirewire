<!DOCTYPE html>
<html>
<head>
  <title>Sign Up - HireWire</title>
</head>

<body style="font-family: Arial; text-align:center; margin-top:100px;">

<h1>Create Account</h1>

<input id="name" type="text" placeholder="Full Name" style="padding:10px; width:250px;"><br><br>
<input id="email" type="email" placeholder="Email" style="padding:10px; width:250px;"><br><br>
<input id="password" type="password" placeholder="Password" style="padding:10px; width:250px;"><br><br>

<button onclick="signup()">Sign Up</button>

<br><br>
<a href="index.html">Back to Home</a>

<script>
function signup() {
  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please fill all fields");
    return;
  }

  let user = { name, email, password };

  localStorage.setItem("hirewire_user", JSON.stringify(user));

  alert("Account created!");

  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
