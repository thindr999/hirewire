<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - HireWire</title>
</head>

<body style="font-family: Arial; margin:0;">

<div style="background:black; color:white; padding:15px;">
  <h2>HireWire Dashboard</h2>
</div>

<div style="padding:20px;">

  <h3 id="welcome"></h3>

  <h3>Available Jobs</h3>

  <div style="border:1px solid #ccc; padding:15px; margin-bottom:10px;">
    <h4>Waiter Needed - Perth CBD</h4>
    <p>$30/hr • 5pm - 11pm</p>
    <button>Accept Job</button>
  </div>

  <button onclick="logout()">Logout</button>

</div>

<script>
let user = JSON.parse(localStorage.getItem("hirewire_user"));

if (!user) {
  window.location.href = "login.html";
} else {
  document.getElementById("welcome").innerText = "Welcome, " + user.name;
}

function logout() {
  localStorage.removeItem("hirewire_user");
  window.location.href = "index.html";
}
</script>

</body>
</html>
